<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Offline — Rocket League Stats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root {
      --bg-base: #07090F;
      --bg-elevated: #13182A;
      --text-primary: #F0F4FF;
      --text-secondary: #7A8AA8;
      --accent-cyan: #00E5FF;
      --team-blue: #00B7FF;
    }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel {
      max-width: 28rem;
      padding: 2.5rem;
      background: var(--bg-elevated);
      border: 1px solid rgba(0, 229, 255, 0.18);
      border-radius: 0.75rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-family: 'Bebas Neue', system-ui, sans-serif;
      font-size: 2.5rem;
      letter-spacing: 0.04em;
      color: var(--accent-cyan);
    }
    p {
      margin: 0 0 1.5rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    button {
      background: var(--team-blue);
      color: #001620;
      border: 0;
      padding: 0.625rem 1.5rem;
      font-family: 'Rajdhani', system-ui, sans-serif;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 0.375rem;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.15); }
  </style>
</head>
<body>
  <main class="panel">
    <h1>You're offline</h1>
    <p>The Rocket League Stats server isn't reachable right now. Cached views you've already opened will still work; everything else returns when the connection is back.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
